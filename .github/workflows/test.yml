name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-detector:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node src/cli.mjs --offline --no-open --output reports/ci
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./start.ps1 --offline --no-open --output reports/launcher
      - name: Unix launcher
        if: runner.os != 'Windows'
        run: bash start.sh --offline --no-open --output reports/launcher
