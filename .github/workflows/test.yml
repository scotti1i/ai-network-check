name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-detector:
    timeout-minutes: 8
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node src/cli.mjs --offline --no-open --output reports/ci
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./start.ps1 --offline --no-open --output reports/launcher
      - name: Unix launcher
        if: runner.os != 'Windows'
        run: bash start.sh --offline --no-open --output reports/launcher
      - name: Windows CMD launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: '& cmd.exe /c ''.\start.cmd --offline --no-open --output reports/cmd'''
  portable-runtime:
    timeout-minutes: 8
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unix official portable runtime
        if: runner.os != 'Windows'
        env:
          SCT_NETWORK_FORCE_RUNTIME: '1'
        run: bash start.sh --offline --no-open --output reports/portable
      - name: Windows official portable runtime
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SCT_NETWORK_FORCE_RUNTIME: '1'
        run: ./start.ps1 --offline --no-open --output reports/portable
